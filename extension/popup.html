<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:320px;font:13px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f7fb;color:#111827}
  .header{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
  .header h1{font-size:15px}.header span{font-size:11px;opacity:.8}
  .body{padding:12px}
  .section{margin-bottom:12px}
  .section label{display:block;font-size:11px;font-weight:700;color:#667085;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
  input,select{width:100%;height:34px;padding:0 10px;border:1px solid #e4e8f0;border-radius:8px;background:#fff;color:#111827;font:13px sans-serif;outline:none;transition:border-color .15s}
  input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .row{display:flex;gap:6px}.row>*{flex:1}
  .btn{height:34px;padding:0 14px;border:1px solid #cfd6e3;border-radius:8px;background:#fff;color:#111827;font:700 12px sans-serif;cursor:pointer;white-space:nowrap;transition:.15s}
  .btn:hover{background:#f0f2f5}
  .btn-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-color:transparent;color:#fff}.btn-primary:hover{background:#1d4ed8}
  .btn:disabled{opacity:.5;cursor:default}
  .mode-row{display:flex;gap:4px;margin-top:4px}
  .mode-btn{flex:1;height:28px;border:1px solid #e4e8f0;border-radius:6px;background:#fff;color:#667085;font:700 11px sans-serif;cursor:pointer;transition:.15s}
  .mode-btn.active{background:#2563eb;color:#fff;border-color:#2563eb}
  .log{max-height:100px;overflow:auto;font-size:10px;color:#98a2b3;line-height:1.6;margin-top:10px;padding:6px 8px;background:#fff;border:1px solid #e4e8f0;border-radius:8px;display:none}
  .switch-row{display:flex;align-items:center;justify-content:space-between}
  .toggle{width:36px;height:20px;border-radius:10px;background:#cfd6e3;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
  .toggle.on{background:#2563eb}
  .toggle:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
  .toggle.on:after{left:18px}
  .login-box{padding:8px 0}
  .login-box input{margin-bottom:8px}
  .error-msg{color:#e11d48;font-size:11px;margin-bottom:8px;display:none}
  .logout-link{font-size:10px;color:rgba(255,255,255,.7);cursor:pointer;text-decoration:underline}
  .logout-link:hover{color:#fff}
  .panel{display:none}.panel.active{display:block}
</style>
</head>
<body>
<div class="header">
  <div><h1>📋 自动投递助手 <span style="font-size:10px;opacity:.6">v1.0</span></h1><span id="conn-status">未登录</span></div>
  <span class="logout-link" id="btn-logout" style="display:none" onclick="doLogout()">退出</span>
</div>

<div class="body">
  <!-- Login panel -->
  <div class="panel active" id="panel-login">
    <div class="login-box">
      <div class="error-msg" id="login-error"></div>
      <input id="username" placeholder="用户名" autocomplete="username">
      <input type="password" id="password" placeholder="密码" autocomplete="current-password">
      <button class="btn btn-primary" id="btn-login" style="width:100%">登 录</button>
    </div>
  </div>

  <!-- Main panel -->
  <div class="panel" id="panel-main">
    <div class="section">
      <label>简历模板</label>
      <select id="profile-select"><option value="">无模板</option></select>
    </div>
    <div class="section">
      <label>填充模式</label>
      <div class="mode-row" id="mode-row">
        <button class="mode-btn active" data-mode="full">全量</button>
        <button class="mode-btn" data-mode="incremental">增量</button>
        <button class="mode-btn" data-mode="ai">AI 匹配</button>
      </div>
    </div>
    <div class="section">
      <div class="switch-row">
        <span style="font-size:12px">自动检测表单</span>
        <span class="toggle on" id="toggle-auto" onclick="toggleAutoDetect()"></span>
      </div>
    </div>
    <div class="row">
      <button class="btn btn-primary" id="btn-fill" style="flex:1">🚀 立即填充</button>
      <button class="btn" id="btn-detect" style="flex:1">🔍 检测字段</button>
    </div>
    <div class="log" id="log">就绪</div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
