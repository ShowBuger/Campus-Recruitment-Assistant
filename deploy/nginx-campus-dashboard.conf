log_format campus '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time '
                  'ref="$http_referer" ua="$http_user_agent"';

upstream campus_dashboard {
    server 127.0.0.1:8765 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    http2 on;
    server_name toudimianban.cloud www.toudimianban.cloud;

    access_log /var/log/nginx/campus-dashboard.access.log campus;
    error_log /var/log/nginx/campus-dashboard.error.log warn;

    client_max_body_size 25m;
    client_header_timeout 30s;
    client_body_timeout 120s;
    keepalive_timeout 65s;
    send_timeout 120s;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.toudimianban.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.toudimianban.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /assets/ {
        alias /opt/campus-recruitment-assistant/static/dist/assets/;
        expires 1y;
    }

    location /dist/assets/ {
        alias /opt/campus-recruitment-assistant/static/dist/assets/;
        expires 1y;
    }

    location /static/ {
        alias /opt/campus-recruitment-assistant/static/;
        expires -1;
    }

    location /api/stream {
        proxy_pass http://campus_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_socket_keepalive on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ai/ {
        proxy_pass http://campus_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location /api/ {
        proxy_pass http://campus_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_socket_keepalive on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location = /guide {
        proxy_pass http://campus_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;
    }

    location = /index.html {
        root /opt/campus-recruitment-assistant/static/dist;
        expires -1;
        try_files /index.html =404;
    }

    location / {
        root /opt/campus-recruitment-assistant/static/dist;
        index index.html;
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 124.222.2.155 toudimianban.cloud www.toudimianban.cloud;
    return 301 https://www.toudimianban.cloud$request_uri;
}
