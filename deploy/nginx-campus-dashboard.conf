upstream campus_dashboard {
    server 127.0.0.1:8765;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name toudimianban.cloud www.toudimianban.cloud;

    client_max_body_size 25m;
    client_header_timeout 30s;
    client_body_timeout 30s;

    ssl_certificate /etc/letsencrypt/live/toudimianban.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toudimianban.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Static files served directly from project directory
    location /assets/ {
        alias /opt/campus-recruitment-assistant/static/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /dist/assets/ {
        alias /opt/campus-recruitment-assistant/static/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /static/ {
        alias /opt/campus-recruitment-assistant/static/;
        expires 1d;
    }

    # SSE stream
    location /api/stream {
        proxy_pass http://campus_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # AI enrich — long timeout for external API calls
    location /api/ai/ {
        proxy_pass http://campus_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # API proxy
    location /api/ {
        proxy_pass http://campus_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Guide page — proxied to FastAPI for correct Content-Type
    location = /guide {
        proxy_pass http://campus_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue SPA — serve index.html for all other routes
    location / {
        root /opt/campus-recruitment-assistant/static/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name toudimianban.cloud www.toudimianban.cloud;
    return 301 https://$host$request_uri;
}
