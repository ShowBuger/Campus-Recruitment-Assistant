# Pre-cutover configuration: serve the application directly over the server IP.
# Replace this file with nginx-campus-dashboard.conf after DNS and TLS are ready.
log_format campus '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time '
                  'ref="$http_referer" ua="$http_user_agent"';

upstream campus_dashboard {
    server 127.0.0.1:8765 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 162.62.54.96 _;

    access_log /var/log/nginx/campus-dashboard.access.log campus;
    error_log /var/log/nginx/campus-dashboard.error.log warn;

    client_max_body_size 25m;
    client_header_timeout 30s;
    client_body_timeout 120s;
    keepalive_timeout 65s;
    send_timeout 120s;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /api/stream {
        proxy_pass http://campus_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://campus_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
